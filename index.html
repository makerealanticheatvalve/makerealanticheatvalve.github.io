<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Webpage</title>
</head>
<body>

  <!-- Main Heading -->
  <h1>Welcome to My Webpage</h1>

  <!-- Paragraph -->
  <p>This is a basic HTML file. Everything inside the body tag is visible on the page.</p>

  <!-- Link -->
  <p>Learn more at <a href="https://developer.mozilla.org/">MDN Web Docs</a>.</p>

  <!-- Bulleted List -->
  <h2>Common HTML Elements:</h2>
  <ul>
    <li>Headings (h1 to h6)</li>
    <li>Paragraphs (p)</li>
    <li>Links (a)</li>
    <li>Images (img)</li>
  </ul>

</body>
</html>
